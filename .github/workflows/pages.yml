name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: verify and build
        run: bash scripts/verify.sh
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
